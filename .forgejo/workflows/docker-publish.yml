name: Build and push Docker image

# Forgejo is the source of truth. The cluster pulls this image from Harbor;
# GitHub Actions and GHCR are intentionally not part of the release path.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: public-harbor.gottaphish.com
  HARBOR_PROJECT: startuppack
  IMAGE_NAME: postal

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          image="${REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${short_sha},${image}:latest" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.HARBOR_USERNAME || secrets.HARBOR_USERNAME || secrets.HARBOR_USER || 'startuppack' }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # The Forgejo runner uses Podman. Its docker-container buildx driver
      # cannot create the required cgroups, so use the classic builder.
      - name: Build and push
        shell: bash
        env:
          DOCKER_BUILDKIT: "0"
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          TAGARGS=()
          for tag in "${TAGS[@]}"; do TAGARGS+=( -t "$tag" ); done
          docker build "${TAGARGS[@]}" \
            --target full \
            --build-arg VERSION="${{ steps.meta.outputs.short_sha }}" \
            --build-arg BRANCH=main \
            -f ./Dockerfile .
          for tag in "${TAGS[@]}"; do docker push "$tag"; done
